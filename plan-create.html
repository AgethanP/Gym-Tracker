
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trainingsplan erstellen – Gym Tracker</title>

    <!-- Gemeinsames Design aller Seiten -->
    <link rel="stylesheet" href="style.css">

    
    <!-- Speicherfunktionen zuerst laden -->
    <script src="storage.js" defer></script>

    <!-- Funktionen zur Erstellung des Trainingsplans -->
    <script src="plan-create.js" defer></script>

</head>

<body>

    <header>
        <h1>Trainingsplan erstellen</h1>
        <p>Stelle deinen eigenen Trainingsplan zusammen.</p>
    </header>

    <main>

        <!-- Name des Trainingsplans -->
        <section>
            <label for="plan-name">Name des Trainingsplans:</label>

            <input
                type="text"
                id="plan-name"
                placeholder="z. B. Push, Pull oder Oberkörper"
            >
        </section>

        <!-- Hier erscheinen die Übungen des Plans -->
        <section>
            <h2>Übungen</h2>

            <div id="plan-exercises"></div>

            <button type="button" id="add-plan-exercise">
                + Übung hinzufügen
            </button>
        </section>

            
        <!-- Speichert den fertigen Trainingsplan -->
        <button type="button" id="save-plan">
            Trainingsplan speichern
        </button>

        <!-- Speichern bauen wir im nächsten Schritt -->
        <p id="plan-status"></p>

        <!-- Zurück zur Startseite -->
        <nav>
            <a href="index.html">← Zur Startseite</a>
        </nav>

    </main>

</body>
</html>
