
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gym Tracker – Trainingshistorie</title>

    <!-- Gemeinsames Design -->
    <link rel="stylesheet" href="style.css">

    <!-- Zuerst Speicherfunktionen laden -->
    <script src="storage.js" defer></script>

    <!-- Danach die Funktionen der Trainingshistorie -->
    <script src="history.js" defer></script>
</head>

<body class="history-page">

    
    <!-- ==========================================
        TRAININGSHISTORIE
        ========================================== -->

    <main class="history-main">

        <!-- Seitenüberschrift -->
        <header class="history-header">

            <p class="history-eyebrow">DEIN FORTSCHRITT</p>

            <h1>Trainingshistorie</h1>

            <p>
                Sieh dir deine vergangenen Trainingseinheiten an.
            </p>

        </header>

        <!--
            Hier erzeugt history.js automatisch
            die gespeicherten Trainingseinheiten.

            Die ID muss unverändert bleiben!
        -->
        <section id="workout-history"></section>

    </main>


<!-- Gemeinsames Farbschema und Navigation -->
<script src="theme.js"></script>
<script src="navigation.js"></script>

</body>
</html>
